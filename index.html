<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palate</title>
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<!-- Palate lives in a claude.ai artifact, so Add to Home Screen always takes claude.ai's icon.
     Palate.mobileconfig is an iOS Web Clip: claude.ai URL, Palate's icon, full screen. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #000; color: #f5f5f5; font: 17px/1.45 -apple-system, system-ui, sans-serif;
         display: grid; place-items: center; text-align: center; padding: 24px 16px; box-sizing: border-box; }
  img { width: 112px; height: 112px; border-radius: 25px; }
  h1 { font-size: 28px; margin: 20px 0 8px; font-weight: 600; }
  ol { color: #a3a3a3; margin: 0 auto; padding-left: 22px; max-width: 320px; text-align: left; }
  li { margin-bottom: 6px; }
  b { color: #f5f5f5; font-weight: 600; }
  a { display: inline-block; margin: 20px 0 24px; padding: 12px 22px; border-radius: 12px; background: #f5f5f5; color: #000;
      text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="icon-512.png" alt="">
    <h1>Palate</h1>
    <a href="Palate.mobileconfig">Get the Palate icon</a>
    <ol>
      <li>Tap <b>Allow</b>, then <b>Close</b>.</li>
      <li>Open <b>Settings</b> and tap <b>Profile Downloaded</b>.</li>
      <li>Tap <b>Install</b> and enter your passcode.</li>
    </ol>
  </main>
</body>
</html>
